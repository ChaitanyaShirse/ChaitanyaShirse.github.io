<style>.radio-wave{fill:none;stroke:#64f7ff;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:5 6;animation:radioPulse 1.4s linear infinite}.radio-wave.wave2{animation-delay:-.45s}.radio-wave.wave3{animation-delay:-.9s}.status-pulse{animation:statusPulse 1.2s ease-in-out infinite}@keyframes radioPulse{from{stroke-dashoffset:0;opacity:.25}50%{opacity:1}to{stroke-dashoffset:-44;opacity:.25}}@keyframes statusPulse{50%{opacity:.35}}</style><rect width="720" height="420" rx="24" fill="url(#bg)"/><rect width="720" height="420" rx="24" fill="url(#grid)"/><path d="M24 56H696M24 364H696" stroke="#63efff" stroke-opacity=".22"/><circle cx="640" cy="90" r="110" fill="#8c5dff" opacity=".08"/><circle cx="95" cy="350" r="120" fill="#00dfff" opacity=".06"/>
