<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><title>Custom Neon Quantum portfolio project illustration</title><defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080f21"/><stop offset=".55" stop-color="#15152e"/><stop offset="1" stop-color="#211338"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d3650" stop-opacity=".96"/><stop offset="1" stop-color="#0b1227" stop-opacity=".98"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#64f7ff"/><stop offset="1" stop-color="#4b9fff"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#cf8bff"/><stop offset="1" stop-color="#8264ff"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#536d89"/><stop offset=".35" stop-color="#18253c"/><stop offset=".7" stop-color="#344b68"/><stop offset="1" stop-color="#111a2d"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
