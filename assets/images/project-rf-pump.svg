 <!-- receiver/starter enclosure --> <g transform="translate(390 115)"><path d="M118 18L118 -14M118 -14L118 -37" stroke="#b8cce7" stroke-width="5" stroke-linecap="round"/><circle cx="118" cy="-38" r="4" fill="#b49aff" filter="url(#glow)"/><rect x="8" y="14" width="232" height="208" rx="15" fill="#080f1c" stroke="#7087a7" stroke-width="2"/><rect x="18" y="24" width="212" height="188" rx="10" fill="url(#metal)" stroke="#65f2ff" stroke-opacity=".55"/><rect x="35" y="42" width="168" height="25" rx="5" fill="#101d31" stroke="#405a78"/><text x="119" y="58" fill="#d5e7ff" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">PUMP STARTER</text><circle cx="55" cy="96" r="8" fill="#6cffbd" filter="url(#glow)"/><text x="73" y="100" fill="#c1d7ed" font-size="10">POWER</text><circle cx="55" cy="124" r="8" fill="#64f3ff"/><text x="73" y="128" fill="#c1d7ed" font-size="10">RF LINK</text><rect x="37" y="148" width="174" height="44" rx="6" fill="#10192a" stroke="#516783"/><rect x="47" y="157" width="45" height="25" rx="3" fill="#183e3a" stroke="#58ffc5"/><text x="69" y="173" fill="#72ffcb" font-size="9" font-weight="700" text-anchor="middle">READY</text><path d="M109 170h16m8 0h16m8 0h16" stroke="#a6bdd9" stroke-width="3" stroke-linecap="round"/><path d="M250 155h24v20h-24m0 12h24" fill="none" stroke="#8aa6c5" stroke-width="5" stroke-linecap="round"/></g>
 <text x="190" y="375" fill="#65f3ff" font-size="11" letter-spacing="2" text-anchor="middle">2-BUTTON RF REMOTE</text><text x="510" y="375" fill="#c6a3ff" font-size="11" letter-spacing="2" text-anchor="middle">ANTENNA RECEIVER / STARTER</text></g></svg>